<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A0510"/>
      <stop offset="40%" stop-color="#6F0C1B"/>
      <stop offset="85%" stop-color="#8B1527"/>
      <stop offset="100%" stop-color="#30030B"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8B1527" stop-opacity="0"/>
    </radialGradient>
    <pattern id="unsPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 30,0 L 60,30 L 30,60 L 0,30 Z" fill="none" stroke="rgba(212, 175, 55, 0.04)" stroke-width="1.2"/>
      <circle cx="30" cy="30" r="2.5" fill="rgba(255, 255, 255, 0.05)"/>
    </pattern>
  </defs>
  <!-- Background base -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <rect width="1920" height="1080" fill="url(#sunGlow)"/>
  <rect width="1920" height="1080" fill="url(#unsPattern)"/>
  
  <!-- Formas geométricas de fondo modernas -->
  <circle cx="1700" cy="200" r="350" fill="none" stroke="rgba(212, 175, 55, 0.12)" stroke-width="2"/>
  <circle cx="1700" cy="200" r="500" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
  <circle cx="200" cy="900" r="400" fill="none" stroke="rgba(212, 175, 55, 0.08)" stroke-width="1.5"/>
</svg>
